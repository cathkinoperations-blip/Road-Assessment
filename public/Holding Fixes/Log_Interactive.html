<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holding Fix Upgrade Photo & Action Log</title>
    <style>
        :root {
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --slate-700: #334155;
            --slate-500: #64748b;
            --slate-100: #f1f5f9;
            --slate-50: #f8fafc;
            --sky-600: #0284c7;
            --sky-700: #0369a1;
            --sky-50: #f0f9ff;
            --amber-500: #f59e0b;
            --amber-50: #fef3c7;
            --amber-900: #78350f;
            --emerald-600: #059669;
            --rose-600: #dc2626;
            --rose-50: #fef2f2;
            --border-color: #cbd5e1;
            --border-light: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--slate-100);
            color: var(--slate-700);
            margin: 0;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1040px; margin: 0 auto; width: 100%; }

        /* Dashboard Header */
        .header-card {
            background: linear-gradient(135deg, var(--slate-900) 0%, var(--slate-800) 100%);
            color: #ffffff;
            padding: 28px 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .header-card h1 { margin: 0 0 8px 0; font-size: 1.65rem; font-weight: 700; letter-spacing: -0.02em; }
        .header-card p { margin: 0; color: #94a3b8; font-size: 0.95rem; }

        /* Location Section Card */
        .section-box {
            background-color: #ffffff;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .section-box:hover { box-shadow: var(--shadow-lg); }

        /* Section Header */
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--slate-100);
            padding-bottom: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .location-heading {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--slate-900);
            letter-spacing: -0.01em;
        }
        .location-badge {
            font-size: 0.85rem;
            background-color: var(--sky-50);
            color: var(--sky-700);
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid #bae6fd;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .location-badge:hover { background-color: #e0f2fe; border-color: var(--sky-600); }

        /* Section Headings */
        .actions-heading, .updates-heading {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--slate-500);
            margin: 0 0 12px 0;
            font-weight: 700;
        }
        
        /* Action Item Cards */
        .action-item-card {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 16px;
            align-items: center;
            background-color: var(--slate-50);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 12px;
            margin-bottom: 12px;
            transition: border-color 0.2s ease;
        }
        .action-item-card:hover { border-color: var(--border-color); }

        .action-thumb-container {
            width: 140px;
            height: 95px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border-light);
            background: #e2e8f0;
            flex-shrink: 0;
            position: relative;
        }
        .action-item-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .action-item-card img:hover { transform: scale(1.06); }

        .action-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--amber-50);
            color: var(--amber-900);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid #fde68a;
            line-height: 1.4;
        }

        /* Updates Container Section */
        .updates-container {
            margin-top: 24px;
            border-top: 1px dashed var(--border-light);
            padding-top: 20px;
        }
        
        .update-card {
            background: #ffffff;
            border: 1px solid var(--border-light);
            border-left: 4px solid var(--sky-600);
            padding: 16px;
            margin-bottom: 14px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.2s ease;
        }
        .update-card:hover { box-shadow: var(--shadow-md); }

        .update-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .update-date {
            font-weight: 700;
            color: var(--sky-700);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--sky-50);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid #bae6fd;
        }
        .update-body {
            color: var(--slate-700);
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .update-thumb {
            max-width: 160px;
            height: 110px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border-light);
            background: #f8fafc;
        }
        .update-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .update-thumb img:hover { transform: scale(1.05); }

        /* Action Buttons */
        .btn {
            font-family: inherit;
            border: none;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background-color: var(--sky-600); color: white; }
        .btn-primary:hover { background-color: var(--sky-700); box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25); }
        
        .btn-success { background-color: var(--emerald-600); color: white; width: 100%; margin-top: 12px; padding: 12px; font-size: 0.95rem; }
        .btn-success:hover { background-color: #047857; }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.8rem;
            background: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--slate-700);
            border-radius: var(--radius-sm);
            box-shadow: none;
        }
        .btn-sm:hover { background-color: var(--slate-50); border-color: var(--slate-500); }
        .btn-danger-sm { color: var(--rose-600); border-color: #fca5a5; }
        .btn-danger-sm:hover { background-color: var(--rose-50); border-color: var(--rose-600); }

        /* Forms */
        .update-form {
            display: none;
            background: var(--slate-50);
            padding: 20px;
            border-radius: var(--radius-md);
            margin-top: 16px;
            border: 1px solid var(--border-color);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .update-form h5 { margin: 0 0 12px 0; color: var(--slate-900); font-size: 1rem; font-weight: 700; }
        .update-form label { font-size: 0.85rem; font-weight: 600; color: var(--slate-700); display: block; margin-bottom: 6px; }
        .update-form input[type="date"],
        .update-form textarea,
        .update-form input[type="file"] {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            background: #fff;
            font-family: inherit;
            color: var(--slate-900);
            transition: border-color 0.2s ease;
        }
        .update-form input[type="date"]:focus,
        .update-form textarea:focus {
            outline: none;
            border-color: var(--sky-600);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
        .update-form textarea { resize: vertical; min-height: 90px; }
        
        .footer { text-align: center; font-size: 0.85rem; color: var(--slate-500); margin-top: 36px; padding-bottom: 24px; font-weight: 500; }

        /* Responsive Mobile Layout */
        @media (max-width: 640px) {
            body { padding: 12px 8px; }
            .section-box { padding: 16px; }
            .action-item-card { grid-template-columns: 1fr; gap: 12px; }
            .action-thumb-container { width: 100%; height: 160px; }
            .header-card { padding: 20px; }
            .section-title { flex-direction: column; align-items: stretch; gap: 10px; }
            .location-badge { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-card">
            <h1>Holding Fix Upgrade Photo & Action Log</h1>
            <p>Live field inspection records, progress tracking, and mobile photo uploads</p>
        </div>

        <div id="locations-wrapper">
            <p style="text-align: center; color: var(--slate-500); padding: 50px; font-weight: 500;">Loading live records from database...</p>
        </div>

        <div class="footer">Cathkin Estates Operations Committee</div>
    </div>

    <script>
        const API_ENDPOINT = '/api/updates';
        let cachedLocations = [];

        async function fetchLogs() {
            try {
                const response = await fetch(API_ENDPOINT);
                cachedLocations = await response.json();
                renderUI(cachedLocations);
            } catch (error) {
                console.error('Failed to load logs:', error);
                document.getElementById('locations-wrapper').innerHTML = '<p style="color: var(--rose-600); text-align: center; font-weight: 600; padding: 40px;">Failed to load data from database backend.</p>';
            }
        }

        function renderUI(locations) {
            const wrapper = document.getElementById('locations-wrapper');
            wrapper.innerHTML = '';

            locations.forEach(loc => {
                let actionCardsHtml = '';
                if (loc.action_items && loc.action_items.length > 0) {
                    loc.action_items.forEach(item => {
                        actionCardsHtml += `
                            <div class="action-item-card">
                                <div class="action-thumb-container">
                                    <a href="${item.photo_url}" target="_blank" title="Click to view full size">
                                        <img src="${item.photo_url}" alt="Action photo">
                                    </a>
                                </div>
                                <div>
                                    <span class="action-tag">⚠️ ${item.action_tag}</span>
                                </div>
                            </div>
                        `;
                    });
                }

                let updatesHtml = '';
                if (loc.updates && loc.updates.length > 0) {
                    loc.updates.forEach(u => {
                        updatesHtml += `
                            <div class="update-card" id="update-card-${u.id}">
                                <div class="update-header-row">
                                    <div class="update-date">📅 ${u.update_date}</div>
                                    <div style="display: flex; gap: 8px;">
                                        <button class="btn btn-sm" onclick="openEditForm(${u.id})">✏️ Edit</button>
                                        <button class="btn btn-sm btn-danger-sm" onclick="deleteUpdate(${u.id})">🗑️ Delete</button>
                                    </div>
                                </div>
                                <div class="update-body" id="update-text-${u.id}">${u.notes}</div>
                                ${u.attachment_url ? `
                                    <div class="update-thumb">
                                        <a href="${u.attachment_url}" target="_blank" title="View attachment full size">
                                            <img src="${u.attachment_url}" alt="Update attachment" />
                                        </a>
                                    </div>` : ''}
                                
                                <!-- Inline Edit Form -->
                                <div id="edit-form-${u.id}" class="update-form">
                                    <h5>Edit Progress Update</h5>
                                    <label>Update Date:</label>
                                    <input type="date" id="edit-date-${u.id}" value="${u.update_date}">
                                    <label>Progress Notes:</label>
                                    <textarea id="edit-notes-${u.id}" rows="2">${u.notes}</textarea>
                                    <label>Replace Image / Attachment (optional):</label>
                                    <input type="file" id="edit-file-${u.id}" accept="image/*">
                                    <button class="btn btn-success" onclick="saveEdit(${u.id})">Save Changes</button>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    updatesHtml = '<p style="font-size: 0.9rem; color: var(--slate-500); font-style: italic; margin-bottom: 16px;">No progress updates logged yet.</p>';
                }

                const cardHtml = `
                    <div class="section-box">
                        <div class="section-title">
                            <div class="location-heading">
                                <span>${loc.location_number}</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                                <a href="${loc.google_maps_url}" target="_blank" class="location-badge">📍 GPS: ${loc.gps_coordinates} ↗</a>
                                <button class="btn btn-primary" onclick="toggleAddForm(${loc.id})">+ Add Update</button>
                            </div>
                        </div>
                        
                        ${actionCardsHtml ? `<h4 class="actions-heading">Required Field Actions</h4>${actionCardsHtml}` : ''}

                        <div class="updates-container">
                            <h4 class="updates-heading">Progress Updates & History</h4>
                            ${updatesHtml}

                            <div id="add-form-${loc.id}" class="update-form">
                                <h5>New Progress Entry</h5>
                                <label>Date:</label>
                                <input type="date" id="new-date-${loc.id}" value="${new Date().toISOString().split('T')[0]}">
                                <label>Description of Work / Status:</label>
                                <textarea id="new-notes-${loc.id}" placeholder="Describe work completed or current status..."></textarea>
                                <label>Attach Image from Phone/PC:</label>
                                <input type="file" id="new-file-${loc.id}" accept="image/*">
                                <button class="btn btn-success" onclick="submitNewUpdate(${loc.id})">Save Update to Database</button>
                            </div>
                        </div>
                    </div>
                `;
                wrapper.innerHTML += cardHtml;
            });
        }

        function toggleAddForm(id) {
            const form = document.getElementById(`add-form-${id}`);
            form.style.display = form.style.display === 'block' ? 'none' : 'block';
        }

        function openEditForm(updateId) {
            const editForm = document.getElementById(`edit-form-${updateId}`);
            editForm.style.display = editForm.style.display === 'block' ? 'none' : 'block';
        }

        function convertFileToBase64(fileInputId) {
            return new Promise((resolve, reject) => {
                const fileInput = document.getElementById(fileInputId);
                if (!fileInput || fileInput.files.length === 0) {
                    resolve(null);
                    return;
                }
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        async function submitNewUpdate(locationId) {
            const update_date = document.getElementById(`new-date-${locationId}`).value;
            const notes = document.getElementById(`new-notes-${locationId}`).value;

            if (!notes) {
                alert('Please enter update notes.');
                return;
            }

            try {
                const attachment_url = await convertFileToBase64(`new-file-${locationId}`);
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ location_id: locationId, update_date, notes, attachment_url })
                });

                if (response.ok) {
                    fetchLogs();
                } else {
                    alert('Failed to save update.');
                }
            } catch (error) {
                console.error('Error posting update:', error);
                alert('Error uploading attachment or saving update.');
            }
        }

        async function saveEdit(updateId) {
            const update_date = document.getElementById(`edit-date-${updateId}`).value;
            const notes = document.getElementById(`edit-notes-${updateId}`).value;

            if (!notes) {
                alert('Notes cannot be empty.');
                return;
            }

            try {
                const attachment_url = await convertFileToBase64(`edit-file-${updateId}`);
                const response = await fetch(API_ENDPOINT, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: updateId, update_date, notes, attachment_url })
                });

                if (response.ok) {
                    fetchLogs();
                } else {
                    alert('Failed to update record.');
                }
            } catch (error) {
                console.error('Error saving edit:', error);
                alert('Network error while saving edit.');
            }
        }

        async function deleteUpdate(updateId) {
            if (!confirm('Are you sure you want to delete this update?')) {
                return;
            }

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: updateId })
                });

                if (response.ok) {
                    fetchLogs();
                } else {
                    alert('Failed to delete update.');
                }
            } catch (error) {
                console.error('Error deleting update:', error);
                alert('Network error while deleting update.');
            }
        }

        fetchLogs();
    </script>
</body>
</html>

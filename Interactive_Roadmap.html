<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cathkin Estates - Interactive AI Roadmap Playground</title>
<style>
    :root {
        --primary-color: #1e293b;
        --accent-color: #0284c7;
        --border-color: #e2e8f0;
        --card-bg: #ffffff;
        --bg-color: #faf8f5;
    }
    
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #334155;
        background-color: var(--bg-color);
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        box-sizing: border-box;
    }

    .app-container {
        display: grid;
        grid-template-columns: 350px 1fr;
        gap: 20px;
        flex: 1;
        overflow: hidden;
    }

    /* Sidebar / Chat Panel */
    .control-panel {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        overflow-y: auto;
    }

    .control-panel h2 {
        margin-top: 0;
        font-size: 1.2rem;
        color: var(--primary-color);
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        margin-bottom: 5px;
        color: #475569;
    }

    .form-group input, .form-group textarea {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-size: 0.85rem;
        box-sizing: border-box;
    }

    .form-group textarea {
        resize: vertical;
        height: 80px;
    }

    .btn {
        background-color: var(--accent-color);
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        font-size: 0.9rem;
        transition: background-color 0.2s;
    }

    .btn:hover {
        background-color: #0369a1;
    }

    .btn:disabled {
        background-color: #94a3b8;
        cursor: not-allowed;
    }

    .chat-history {
        flex: 1;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        background: #f8fafc;
        padding: 10px;
        overflow-y: auto;
        margin-bottom: 15px;
        font-size: 0.8rem;
    }

    .chat-msg {
        margin-bottom: 8px;
        padding: 6px 10px;
        border-radius: 6px;
        line-height: 1.4;
    }

    .chat-msg.user {
        background-color: #e0f2fe;
        color: #0369a1;
        text-align: right;
    }

    .chat-msg.ai {
        background-color: #f1f5f9;
        color: #334155;
    }

    .chat-msg.error {
        background-color: #fee2e2;
        color: #991b1b;
    }

    /* Preview Panel */
    .preview-panel {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
    }

    .preview-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 10px;
    }

    .preview-header h3 {
        margin: 0;
        color: var(--primary-color);
        font-size: 1rem;
    }

    #render-frame {
        width: 100%;
        flex: 1;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: white;
    }

    .loading-overlay {
        display: none;
        font-size: 0.85rem;
        color: #0284c7;
        font-weight: 600;
        text-align: center;
        margin-top: 10px;
    }
</style>

        </div>

            <label>Conversation Log</label>
            <div id="chat-history" class="chat-history">
                <div class="chat-msg ai">Ready. Type instructions below to modify your roadmap template.</div>
            </div>
        </div>

        <div class="form-group">
            <label for="user-prompt">Prompt Roadmap</label>
            <textarea id="user-prompt" placeholder="e.g., Move U-drains to Sept - Nov"></textarea>
        </div>

        <button id="send-btn" class="btn" onclick="sendPrompt()">Update Roadmap</button>
        <div id="loading" class="loading-overlay">Gemini is updating your roadmap...</div>
    </div>

    <!-- Live Preview Panel -->
    <div class="preview-panel">
        <div class="preview-header">
            <h3>Live Roadmap Preview</h3>
            <button class="btn" style="width: auto; padding: 5px 10px; font-size: 0.75rem;" onclick="exportHTML()">Export HTML</button>
        </div>
        <iframe id="render-frame"></iframe>
    </div>

    // Initialize preview frame
    window.onload = function() {

        if (savedKey) {

    function updatePreview() {
        const frame = document.getElementById('render-frame');
        const doc = frame.contentDocument || frame.contentWindow.document;
        doc.open();
        doc.write(currentHTML);
        doc.close();
    }

    async function sendPrompt() {
        const apiKey = document.getElementById('api-key').value.trim();
        const promptInput = document.getElementById('user-prompt');
        const prompt = promptInput.value.trim();
        const historyEl = document.getElementById('chat-history');
        const loadingEl = document.getElementById('loading');
        const sendBtn = document.getElementById('send-btn');

        if (!apiKey) {
            alert('Please enter your Gemini API Key.');
            return;
        }
        if (!prompt) return;

        // Save API key locally
        localStorage.setItem('gemini_api_key', apiKey);

        // Append user prompt to log
        historyEl.innerHTML += `<div class="chat-msg user">${escapeHtml(prompt)}</div>`;
        promptInput.value = '';
        historyEl.scrollTop = historyEl.scrollHeight;

        // UI Loading state
        loadingEl.style.display = 'block';
        sendBtn.disabled = true;

        const systemInstruction = "You are a specialized code-editing assistant. The user will provide instructions to modify an existing HTML roadmap. You must return ONLY the complete, valid updated HTML document, including all internal CSS and layout styles. Do not include markdown code block syntax (like ```html) in your response—output raw HTML text only.";

        const requestBody = {
            contents: [
                {
                    parts: [
                        { text: systemInstruction + "\n\nCurrent HTML Document:\n" + currentHTML + "\n\nUser Instruction: " + prompt }
                    ]
                }
            ]
        };

        try {
            const response = await fetch(`[https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=$](https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=$){apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                let newCode = data.candidates[0].content.parts[0].text;
                // Strip markdown wrappers if present
                newCode = newCode.replace(/^```html\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/, '');
                
                currentHTML = newCode;
                updatePreview();
                historyEl.innerHTML += `<div class="chat-msg ai">Roadmap successfully updated.</div>`;
            } else {
                throw new Error(data.error ? data.error.message : 'Invalid response structure from API.');
            }
        } catch (err) {
            historyEl.innerHTML += `<div class="chat-msg error">Error: ${escapeHtml(err.message)}</div>`;
        } finally {
            loadingEl.style.display = 'none';
            sendBtn.disabled = false;
            historyEl.scrollTop = historyEl.scrollHeight;
        }
    }

    function exportHTML() {
        const blob = new Blob([currentHTML], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'cathkin-road-roadmap.html';
        a.click();
        URL.revokeObjectURL(url);
    }

    function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, m => map[m]);
    }

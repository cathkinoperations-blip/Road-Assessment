<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cathkin Estates - Versioned AI Roadmap Playground</title>
<style>
    :root {
        --primary-color: #1e293b;
        --accent-color: #0284c7;
        --border-color: #e2e8f0;
        --card-bg: #ffffff;
        --bg-color: #faf8f5;
    }
    
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #334155;
        background-color: var(--bg-color);
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        box-sizing: border-box;
    }

    .app-container {
        display: grid;
        grid-template-columns: 350px 1fr;
        gap: 20px;
        flex: 1;
        overflow: hidden;
    }

    .control-panel {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        overflow-y: auto;
    }

    .control-panel h2 {
        margin-top: 0;
        font-size: 1.2rem;
        color: var(--primary-color);
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        margin-bottom: 5px;
        color: #475569;
    }

    .form-group input, .form-group textarea, .form-group select {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-size: 0.85rem;
        box-sizing: border-box;
        background: white;
    }

    .form-group textarea {
        resize: vertical;
        height: 80px;
    }

    .btn {
        background-color: var(--accent-color);
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        font-size: 0.9rem;
        transition: background-color 0.2s;
        margin-bottom: 8px;
    }

    .btn:hover {
        background-color: #0369a1;
    }

    .btn:disabled {
        background-color: #94a3b8;
        cursor: not-allowed;
    }

    .chat-history {
        flex: 1;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        background: #f8fafc;
        padding: 10px;
        overflow-y: auto;
        margin-bottom: 15px;
        font-size: 0.8rem;
        max-height: 150px;
    }

    .chat-msg {
        margin-bottom: 8px;
        padding: 6px 10px;
        border-radius: 6px;
        line-height: 1.4;
    }

    .chat-msg.user {
        background-color: #e0f2fe;
        color: #0369a1;
        text-align: right;
    }

    .chat-msg.ai {
        background-color: #f1f5f9;
        color: #334155;
    }

    .chat-msg.error {
        background-color: #fee2e2;
        color: #991b1b;
    }

    .preview-panel {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
    }

    .preview-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 10px;
    }

    .preview-header h3 {
        margin: 0;
        color: var(--primary-color);
        font-size: 1rem;
    }

    #render-frame {
        width: 100%;
        flex: 1;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: white;
    }

    .loading-overlay {
        display: none;
        font-size: 0.85rem;
        color: #0284c7;
        font-weight: 600;
        text-align: center;
        margin-top: 10px;
    }
</style>
</head>
<body>

<div class="app-container">
    <div class="control-panel">
        <h2>AI Updates & Versioned Cloud</h2>
        
        <div class="form-group">
            <label for="model-select">Gemini Model</label>
            <select id="model-select">
                <option value="gemini-3.5-flash-lite" selected>Gemini 3.5 Flash-Lite</option>
                <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
                <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>    
            </select>
        </div>

        <div class="form-group">
            <label for="gh-repo">GitHub Repo (owner/repo)</label>
            <input type="text" id="gh-repo" value="cathkinoperations-blip/Road-Assessment" placeholder="cathkinoperations-blip/Road-Assessment" />
        </div>

        <div class="form-group">
            <label for="gh-token">GitHub Personal Access Token</label>
            <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx" />
        </div>

        <div class="form-group">
            <label for="api-key">Gemini API Key</label>
            <input type="password" id="api-key" placeholder="Enter your Gemini API key" />
        </div>

        <div class="form-group">
            <label>Conversation Log</label>
            <div id="chat-history" class="chat-history">
                <div class="chat-msg ai">Ready. Type instructions below to modify your roadmap template.</div>
            </div>
        </div>

        <div class="form-group">
            <label for="user-prompt">Prompt Roadmap</label>
            <textarea id="user-prompt" placeholder="e.g., Move U-drains to Sept - Nov"></textarea>
        </div>

        <button id="send-btn" class="btn" onclick="sendPrompt()">Update Roadmap</button>
        <button id="save-cloud-btn" class="btn" onclick="saveNewVersionToGitHub()">Save New Version to Cloud</button>

        <div id="loading" class="loading-overlay">Gemini is updating your roadmap...</div>
    </div>

    <div class="preview-panel">
        <div class="preview-header">
            <h3>Live Roadmap Preview</h3>
            <button class="btn" style="width: auto; padding: 5px 10px; font-size: 0.75rem; margin-bottom: 0;" onclick="exportHTML()">Export HTML</button>
        </div>
        <iframe id="render-frame"></iframe>
    </div>
</div>

<script>
    let currentHTML = `<!DOCTYPE html>
<html>
<head>
<style>
    :root {
        --primary-color: #1e293b;
        --accent-color: #0284c7;
        --border-color: #e2e8f0;
        --card-bg: #ffffff;
    }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #334155;
        background-color: #faf8f5;
        padding: 20px;
    }
    .gantt-spreadsheet {
        width: 100%;
        border-collapse: collapse;
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        font-size: 0.8rem;
    }
    .gantt-spreadsheet th {
        background-color: var(--primary-color);
        color: white;
        padding: 10px;
        text-align: center;
        font-weight: 600;
        border: none;
    }
    .gantt-spreadsheet td {
        padding: 8px 10px;
        border: 1px solid var(--border-color);
        text-align: center;
        vertical-align: middle;
    }
    .gantt-spreadsheet tr:nth-child(even) { background-color: #f8fafc; }
    .gantt-spreadsheet .task-name { 
        text-align: left; 
        font-weight: 600; 
        color: var(--primary-color);
        padding-left: 15px;
    }
    .gantt-spreadsheet .sub-task-name { 
        text-align: left; 
        color: #475569;
        padding-left: 25px;
        font-size: 0.75rem;
    }
    .shaded { background-color: var(--accent-color) !important; color: white; border-radius: 4px; }
    .milestone { background-color: #ea580c !important; color: white; border-radius: 4px; font-weight: bold; }
    .completed { background-color: #10b981 !important; color: white; border-radius: 4px; }
    .in-progress { background-color: #3b82f6 !important; color: white; border-radius: 4px; }
    .header-card {
        background-color: var(--primary-color);
        color: #ffffff;
        padding: 24px;
        border-radius: 12px;
        margin-bottom: 20px;
    }
    .header-card h1 { margin: 0; font-size: 1.5rem; }
    .header-card p { margin: 5px 0 0; color: #94a3b8; font-size: 0.9rem; }
</style>
</head>
<body>
    <div class="header-card">
        <h1>Cathkin Estates Road Upgrade</h1>
        <p>Detailed Project Phasing & Implementation Roadmap (Aug 2026 – May 2027)</p>
    </div>
    
    <table class="dataframe gantt-spreadsheet">
        <thead>
            <tr>
                <th class="task-name">Task / Sub-Task</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>% Complete</th>
                <th>Aug 26</th>
                <th>Sep 26</th>
                <th>Oct 26</th>
                <th>Nov 26</th>
                <th>Dec 26</th>
                <th>Jan 27</th>
                <th>Feb 27</th>
                <th>Mar 27</th>
                <th>Apr 27</th>
                <th>May 27</th>
            </tr>
        </thead>
        <tbody>
            <tr style="background-color: #e2e8f0; font-weight: bold;">
                <td class="task-name" colspan="4">Phase 0: Initial Assessment & Scoping (Completed)</td>
                <td colspan="10"></td>
            </tr>
            <tr>
                <td class="sub-task-name">0.1 Site Audit & Photographic Analysis</td>
                <td>2026-08-01</td>
                <td>2026-08-31</td>
                <td><strong>100%</strong></td>
                <td class="completed">✓</td>
                <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
            </tr>
        </tbody>
    </table>
</body>
</html>`;

    window.onload = async function() {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) document.getElementById('api-key').value = savedKey;

        const savedToken = localStorage.getItem('gh_token');
        if (savedToken) document.getElementById('gh-token').value = savedToken;

        const savedRepo = localStorage.getItem('gh_repo');
        if (savedRepo) document.getElementById('gh-repo').value = savedRepo;

        await loadLatestRoadmapFromGitHub();
    };

    async function loadLatestRoadmapFromGitHub() {
        const repo = document.getElementById('gh-repo').value.trim();
        const token = document.getElementById('gh-token').value.trim();
        if (!repo) return;

        try {
            const headers = { 'Accept': 'application/vnd.github+json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;

            // Check files inside the 'roadmaps' folder in the repository
            const res = await fetch(`https://api.github.com/repos/${repo}/contents/roadmaps`, { headers });
            if (res.ok) {
                const files = await res.json();
                // Filter HTML files and sort alphabetically/chronologically descending to grab the newest version
                const htmlFiles = files.filter(f => f.name.endsWith('.html')).sort((a, b) => b.name.localeCompare(a.name));
                
                if (htmlFiles.length > 0) {
                    const latestFileRes = await fetch(htmlFiles[0].download_url);
                    if (latestFileRes.ok) {
                        currentHTML = await latestFileRes.text();
                    }
                }
            }
        } catch (e) {
            console.log('No prior versioned roadmaps found in roadmaps/ folder.');
        }
        updatePreview();
    }

    function updatePreview() {
        const frame = document.getElementById('render-frame');
        const doc = frame.contentDocument || frame.contentWindow.document;
        doc.open();
        doc.write(currentHTML);
        doc.close();
    }

    function trimChatHistory() {
        const historyEl = document.getElementById('chat-history');
        const messages = historyEl.querySelectorAll('.chat-msg');
        if (messages.length > 10) {
            for (let i = 0; i < messages.length - 10; i++) {
                historyEl.removeChild(messages[i]);
            }
        }
    }

    async function sendPrompt() {
        const apiKey = document.getElementById('api-key').value.trim();
        const promptInput = document.getElementById('user-prompt');
        const prompt = promptInput.value.trim();
        const historyEl = document.getElementById('chat-history');
        const loadingEl = document.getElementById('loading');
        const sendBtn = document.getElementById('send-btn');
        const selectedModel = document.getElementById('model-select').value;

        if (!apiKey) {
            alert('Please enter your Gemini API Key.');
            return;
        }
        if (!prompt) return;

        localStorage.setItem('gemini_api_key', apiKey);

        historyEl.innerHTML += `<div class="chat-msg user">${escapeHtml(prompt)}</div>`;
        promptInput.value = '';
        trimChatHistory();
        historyEl.scrollTop = historyEl.scrollHeight;

        loadingEl.style.display = 'block';
        sendBtn.disabled = true;

        const systemInstruction = "You are a specialized code-editing assistant. The user will provide instructions to modify an existing HTML roadmap table document. You must return ONLY the complete, valid updated HTML document, including all internal CSS and layout styles. Do not include markdown code block syntax (like ```html) in your response—output raw HTML text only.";

        const requestBody = {
            contents: [
                {
                    parts: [
                        { text: systemInstruction + "\n\nCurrent HTML Roadmap Document:\n" + currentHTML + "\n\nUser Instruction: " + prompt }
                    ]
                }
            ]
        };

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            }); 

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`API Error (${response.status}): ${errText}`);
            }

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                let newCode = data.candidates[0].content.parts[0].text;
                newCode = newCode.replace(/^```html\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/, '');
                
                currentHTML = newCode;
                updatePreview();
                historyEl.innerHTML += `<div class="chat-msg ai">Roadmap successfully updated locally.</div>`;
                trimChatHistory();
            } else {
                throw new Error(data.error ? data.error.message : 'Invalid response structure from API.');
            }
        } catch (err) {
            historyEl.innerHTML += `<div class="chat-msg error">Error: ${escapeHtml(err.message)}</div>`;
            trimChatHistory();
        } finally {
            loadingEl.style.display = 'none';
            sendBtn.disabled = false;
            historyEl.scrollTop = historyEl.scrollHeight;
        }
    }

    async function saveNewVersionToGitHub() {
        const repo = document.getElementById('gh-repo').value.trim();
        const token = document.getElementById('gh-token').value.trim();
        const btnEl = document.getElementById('save-cloud-btn');

        if (!repo || !token) {
            alert('Please enter both your GitHub Repository and Personal Access Token.');
            return;
        }

        localStorage.setItem('gh_token', token);
        localStorage.setItem('gh_repo', repo);

        btnEl.textContent = 'Saving New Version...';
        btnEl.disabled = true;

        try {
            const headers = {
                'Accept': 'application/vnd.github+json',
                'Authorization': `Bearer ${token}`
            };

            // Generate unique timestamp filename inside a 'roadmaps/' folder
            const now = new Date();
            const timestamp = now.toISOString().replace(/[:T]/g, '-').slice(0, 19);
            const fileName = `roadmaps/roadmap_${timestamp}.html`;

            const base64Content = btoa(unescape(encodeURIComponent(currentHTML)));

            const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/${fileName}`, {
                method: 'PUT',
                headers: headers,
                body: JSON.stringify({
                    message: `Add new version roadmap snapshot: ${timestamp}`,
                    content: base64Content
                })
            });

            if (!putRes.ok) {
                const errJson = await putRes.json();
                throw new Error(errJson.message || 'Failed to upload version file to GitHub.');
            }

            alert(`Successfully saved new version as '${fileName}' to GitHub!`);
        } catch (err) {
            alert('GitHub Versioning Error: ' + err.message);
        } finally {
            btnEl.textContent = 'Save New Version to Cloud';
            btnEl.disabled = false;
        }
    }

    function exportHTML() {
        const blob = new Blob([currentHTML], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'roadmap_snapshot.html';
        a.click();
        URL.revokeObjectURL(url);
    }

    function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, m => map[m]);
    }
</script>

</body>
</html>
